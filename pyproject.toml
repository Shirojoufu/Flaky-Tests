[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-detector"
version = "0.1.0"
description = "Detect flaky tests across GitHub Actions runs by comparing outcomes on unchanged code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
flaky-detector = "flaky_detector.cli:main"

[tool.setuptools.packages.find]
include = ["flaky_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Measure the tests too so per-test fingerprints include the test code itself;
# the detector leaves test files out of the coverage percentages it reports.
source = ["flaky_detector", "tests"]
relative_files = true
# Per-test contexts are incomplete with the sys.monitoring core that Python 3.14+ defaults to.
core = "ctrace"

[tool.coverage.json]
show_contexts = true
