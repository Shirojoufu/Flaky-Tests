name: Tests and flaky test detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # the detector pushes run records to the flaky-data branch

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff coverage needs the base commit
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[test]"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: >
          pytest -v
          --junitxml=.flaky/junit.xml
          --cov --cov-context=test --cov-report=term
          --cov-report=json:.flaky/coverage.json

      # A test that fails and then passes on the same commit is the clearest sign of a flake.
      - name: Retry failed tests
        id: retry
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: pytest -v --last-failed --no-cov --junitxml=.flaky/junit-retry-1.xml

      - name: Detect flaky tests
        if: always() && steps.tests.outcome != 'skipped'
        uses: ./
        with:
          junit: .flaky/junit.xml
          retry-junit: .flaky/junit-retry-*.xml
          coverage: .flaky/coverage.json
          python: python

      - name: Fail on real test failures
        if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
        run: |
          echo "::error::Tests failed and still failed on retry. See the job summary for details."
          exit 1

  # End-to-end check of this commit's detector: replay Flaky-Test-Lab's 30-run history (races,
  # timeouts, node crashes, real regressions, a matrix...) and require every verdict to be right.
  lab-validation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: Shirojoufu/Flaky-Test-Lab
          path: lab
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install this detector and the lab
        run: pip install -e . -e "./lab[test]"

      - name: Simulate and validate
        run: python lab/sim/simulate.py --out sim-output --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: sim-output
